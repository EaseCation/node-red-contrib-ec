<script type="text/javascript">
    RED.nodes.registerType('ec-delay', {
        category: 'EC蓝图/时间',
        color: '#E5E5E5',
        defaults: {
            name: { value: "" },
            delayTime: { value: 1000, required: true },
            uiType: { value: "None", required: true },
            uiText: { value: "", required: false },
            uiTextSub: { value: "", required: false },
            uiSendTargetType: { value: "All", required: true },
            uiSendTarget: { value: "", required: false }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-clock-o",
        label: function() {
            return (this.name || "延迟执行") + " (" + this.delayTime + "ms)";
        },
        paletteLabel: "延迟执行",
    });
</script>

<script type="text/html" data-template-name="ec-delay">
    <div class="form-row">
        <label for="node-input-name">
            <i class="fa fa-tag"></i> 名称
        </label>
        <input type="text" id="node-input-name" placeholder="可视化名称（仅用于编辑器中显示）">
    </div>
    <div class="form-row">
        <label for="node-input-delayTime">
            <i class="fa fa-clock-o"></i> 延迟时间 (毫秒)
        </label>
        <input type="number" id="node-input-delayTime" min="0" placeholder="1000">
    </div>

    <div class="form-row">
        <label for="node-input-uiType">
            <i class="fa fa-eye"></i> 显示UI的类型
        </label>
        <select id="node-input-uiType">
            <option value="None">None</option>
            <option value="Title">Title</option>
            <option value="ActionBar">ActionBar</option>
            <option value="ModUI">ModUI</option>
        </select>
    </div>
    
    <div class="form-row">
        <label for="node-input-uiText">
            <i class="fa fa-font"></i> UI文本 (TranslateMessage本地化文本)
        </label>
        <input type="text" id="node-input-uiText" placeholder="输入UI本地化文本key">
    </div>
    
    <div class="form-row">
        <label for="node-input-uiTextSub">
            <i class="fa fa-font"></i> UI副文本 (TranslateMessage本地化文本)
        </label>
        <input type="text" id="node-input-uiTextSub" placeholder="输入UI本地化文本key">
    </div>

    <div class="form-row">
        <label for="node-input-uiSendTargetType">
            <i class="fa fa-gear"></i> UI发送目标类型
        </label>
        <select id="node-input-uiSendTargetType">
            <option value="All">All</option>
            <option value="Team">Team</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-uiSendTarget">
            <i class="fa fa-font"></i> UI发送目标
        </label>
        <input type="text" id="node-input-uiSendTarget" placeholder="输入UI发送目标">
    </div>
</script>

<script type="text/html" data-help-name="ec-delay">
    <p>延迟一段时间（毫秒）后再执行下一个节点。</p>
</script>
