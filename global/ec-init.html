<script type="text/javascript">
    RED.nodes.registerType('ec-init', {
        category: 'EC蓝图/全局',
        color: '#ADD8E6',
        defaults: {
            name: { value: "" }
        },
        inputs: 0,
        outputs: 1,
        icon: "font-awesome/fa-rocket",
        label: function() {
            return this.name || "开始流程" + (this.result ? (": " + this.result) : "");
        },
        paletteLabel: "开始流程"
    });
</script>

<script type="text/html" data-template-name="ec-init">
    <div class="form-row">
        <label for="node-input-name">
            <i class="fa fa-tag"></i> 名称
        </label>
        <input type="text" id="node-input-name" placeholder="可视化名称（仅用于编辑器中显示）">
    </div>
</script>

<script type="text/html" data-help-name="ec-init">
    <p>开始流程，控制传递到蓝图中。</p>
</script>
